[package]
name = "pixel-code"
version = "0.2.2"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
vt100 = "0.16.2"
